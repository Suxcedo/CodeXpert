<!DOCTYPE html>
<html lang="en">
<head>

<title>Log in</title>
<link rel="stylesheet" href="loginstyle.css">
</head>
<body>

  <div class="top-bar-glow"></div>

  <header class="site-header">
    <a href="#" class="logo">
      <img src="1000017202.jpg" alt="Logo" class="logo-img">
    </a>
    <a href="#" class="back-link">&larr; Back to home</a>
  </header>

  <main class="auth-wrapper">

    <div class="tabs">
      <button class="tab tab--active" type="button">Log in</button>
      <button class="tab" type="button">Sign up</button>
    </div>

    <div class="card">
      <h1 class="card-title">Welcome back.</h1>
      <p class="card-subtitle">Continue your streak today.</p>

      <div class="oauth-buttons">
        <button class="oauth-btn" type="button">
          <span class="oauth-icon">G</span>
          Continue with Google
        </button>
        <button class="oauth-btn" type="button">
          <span class="oauth-icon">GH</span>
          Continue with GitHub
        </button>
      </div>

      <div class="divider">
        <span>or with email</span>
      </div>

      <form class="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <a href="#" class="forgot-link">Forgot password?</a>

        <button type="submit" class="submit-btn">
          Log in <span class="arrow">&rarr;</span>
        </button>
      </form>
    </div>

    <div class="streak-banner">
      <span class="streak-icon">&#128293;</span>
      <div class="streak-text">
        <p class="streak-title">alex_dev is on a 89-day streak</p>
        <p class="streak-subtitle">278 learners coded today. Don't let your streak die.</p>
      </div>
    </div>

  </main>

</body>
</html>
